# Ilustraciones para los vídeos con modelos abiertos (SDXL + SDXL-Lightning, OpenRAIL++-M), en CPU. Sin claves ni coste.
# Se lanza al subir imagenes/pedidos/<trabajo>.json: {"trabajo", "trozos", "estilo", "negativo", "imagenes": [{"id", "prompt", "seed"?}]}
name: "Imágenes · ilustraciones"
on:
  push:
    branches: [main]
    paths: ["imagenes/pedidos/*.json"]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      trozos: ${{ steps.p.outputs.trozos }}
      trabajo: ${{ steps.p.outputs.trabajo }}
      fichero: ${{ steps.p.outputs.fichero }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: p
        run: |
          f=$(git diff --name-only HEAD~1 HEAD -- imagenes/pedidos | tail -1); [ -n "$f" ] || f=$(ls -t imagenes/pedidos/*.json | head -1)
          python3 -c "import json;p=json.load(open('$f'));n=p.get('trozos',4);print('trozos='+json.dumps(list(range(n))));print('trabajo='+p['trabajo'])" >> $GITHUB_OUTPUT
          echo "fichero=$f" >> $GITHUB_OUTPUT
  generar:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        trozo: ${{ fromJSON(needs.plan.outputs.trozos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Dependencias
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors huggingface_hub "rembg[cpu]" pillow
      - name: Trozo ${{ matrix.trozo }}
        run: |
          free -g; nproc
          python imagenes/gen.py ${{ needs.plan.outputs.fichero }} ${{ matrix.trozo }} ${{ strategy.job-total }} out
      - uses: actions/upload-artifact@v4
        with: { name: "img-${{ matrix.trozo }}", path: out }
  juntar:
    needs: [plan, generar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "img-*", path: salida, merge-multiple: true }
      - name: Guardar en salidas-${{ needs.plan.outputs.trabajo }}
        run: |
          cd salida && ls
          git init -q -b salidas-${{ needs.plan.outputs.trabajo }} && git add -A
          git -c user.name=atlas-bot -c user.email=atlas-bot@users.noreply.github.com commit -qm "Imágenes ${{ needs.plan.outputs.trabajo }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" salidas-${{ needs.plan.outputs.trabajo }}
